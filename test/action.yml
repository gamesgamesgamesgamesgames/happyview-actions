name: 'HappyView Test'
description: 'Run a HappyView project''s test files (hpy happyview test)'
author: 'gamesgamesgamesgamesgames'
branding:
  icon: 'check-square'
  color: 'green'
inputs:
  working-directory:
    description: 'The HappyView project, the directory holding happyview.toml'
    required: false
    default: '.'
  locked:
    description: 'Fail rather than update happyview.lock when it no longer matches happyview.toml'
    required: false
    default: 'true'
  filter:
    description: 'Only run test files whose path contains this'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: hpy happyview test
      shell: bash
      env:
        PROJECT: ${{ inputs.working-directory }}
        LOCKED: ${{ inputs.locked }}
        FILTER: ${{ inputs.filter }}
      run: |
        if ! command -v hpy > /dev/null; then
          echo "::error::hpy is not installed; run gamesgamesgamesgamesgames/happyview-actions/setup-hpy first"
          exit 1
        fi
        args=(--no-input -C "$PROJECT" happyview test)
        if [ "$LOCKED" = "true" ]; then args+=(--locked); fi
        if [ -n "$FILTER" ]; then args+=(-- "$FILTER"); fi
        hpy "${args[@]}"
