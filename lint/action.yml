name: 'HappyView Lint'
description: 'Offline validation of HappyView lexicons, scripts, jobs, and labelers'
author: 'gamesgamesgamesgamesgames'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  lexicons:
    description: 'Newline-delimited glob pattern list for lexicon JSON (! excludes)'
    required: false
    default: 'lexicons/**/*.json'
  scripts:
    description: 'Newline-delimited glob pattern list for route/record Lua scripts'
    required: false
    default: 'lua/**/*.lua'
  jobs:
    description: 'Newline-delimited glob pattern list for job Lua scripts'
    required: false
    default: 'jobs/**/*.lua'
  labelers:
    description: 'Newline-delimited glob pattern list for labeler Lua scripts'
    required: false
    default: 'labelers/**/*.lua'
  check-lua-syntax:
    description: 'Best-effort Lua parse of every discovered .lua file'
    required: false
    default: 'true'
  fail-on:
    description: 'Threshold that fails the action: error or warning'
    required: false
    default: 'error'
outputs:
  errors:
    description: 'Number of errors'
  warnings:
    description: 'Number of warnings'
runs:
  using: 'node24'
  main: 'dist/index.cjs'
