name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: fixtures/project

jobs:
  setup-hpy:
    name: setup-hpy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: hpy
        uses: ./setup-hpy
        with:
          working-directory: ${{ env.PROJECT }}
      - name: hpy is on PATH at the pinned version
        env:
          VERSION: ${{ steps.hpy.outputs.version }}
          BIN: ${{ steps.hpy.outputs.path }}
        run: |
          test "$(hpy --version)" = "hpy $VERSION"
          test "$(command -v hpy)" = "$BIN/hpy"
          test -d "$HPY_CACHE_DIR"
          test -n "$(find "$HPY_CACHE_DIR" -maxdepth 0 -perm 700)"
      - id: bad-version
        continue-on-error: true
        uses: ./setup-hpy
        with:
          version: beta
          cache: 'false'
      - name: A version that is not an exact release is refused
        if: steps.bad-version.outcome != 'failure'
        run: exit 1

  check-and-test:
    name: check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-hpy
        with:
          working-directory: ${{ env.PROJECT }}
      - uses: ./check
        with:
          working-directory: ${{ env.PROJECT }}
      - uses: ./test
        with:
          working-directory: ${{ env.PROJECT }}
      - uses: ./test
        with:
          working-directory: ${{ env.PROJECT }}
          filter: hello
      - id: no-tests
        continue-on-error: true
        uses: ./test
        with:
          working-directory: ${{ env.PROJECT }}
          filter: no-such-test
      - name: A run with no tests fails the step
        if: steps.no-tests.outcome != 'failure'
        run: exit 1
      - name: happyview.lock is unchanged
        run: git diff --exit-code -- "$PROJECT"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    env:
      HAPPYVIEW_URL: http://127.0.0.1:3999
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-hpy
        with:
          working-directory: ${{ env.PROJECT }}
      # Downloads the HappyView the project pins, which the instance runs.
      - uses: ./check
        with:
          working-directory: ${{ env.PROJECT }}
      - name: Start an instance with a key that holds only what a deploy needs
        id: instance
        run: |
          command -v sqlite3 > /dev/null || { sudo apt-get update -q && sudo apt-get install -yq sqlite3; }
          .github/scripts/serve-happyview.sh "$PROJECT" "$RUNNER_TEMP/instance" \
            '["project:deploy","plugins:read","plugins:create"]'
          echo "key=$(cat "$RUNNER_TEMP/instance/key")" >> "$GITHUB_OUTPUT"

      - id: wrong-key
        continue-on-error: true
        uses: ./deploy
        with:
          url: ${{ env.HAPPYVIEW_URL }}
          api-key: hv_00000000000000000000000000000000
          working-directory: ${{ env.PROJECT }}
      - name: A key the instance does not know fails the step
        if: steps.wrong-key.outcome != 'failure'
        run: exit 1

      - uses: ./deploy
        with:
          url: ${{ env.HAPPYVIEW_URL }}
          api-key: ${{ steps.instance.outputs.key }}
          working-directory: ${{ env.PROJECT }}
          dry-run: 'true'
      - name: A dry run changes nothing
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$HAPPYVIEW_URL/xrpc/com.example.hello?name=ci")
          test "$status" != 200

      - uses: ./deploy
        with:
          url: ${{ env.HAPPYVIEW_URL }}
          api-key: ${{ steps.instance.outputs.key }}
          working-directory: ${{ env.PROJECT }}
      - name: The deployed project answers
        run: |
          test "$(curl -fsS "$HAPPYVIEW_URL/xrpc/com.example.hello?name=ci")" = '{"message":"Hello, ci!"}'

      - name: A second deploy finds the instance up to date
        uses: ./deploy
        with:
          url: ${{ env.HAPPYVIEW_URL }}
          api-key: ${{ steps.instance.outputs.key }}
          working-directory: ${{ env.PROJECT }}

      - name: HappyView's log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/instance/happyview.log"

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  release:
    name: Release
    needs: [setup-hpy, check-and-test, deploy]
    # Only from main: dispatched from another branch, the tag step below
    # would move the major's tag onto that branch.
    if: >-
      github.ref == 'refs/heads/main'
      && ((github.event_name == 'push'
          && !contains(github.event.head_commit.message, 'skip ci'))
        || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Read released version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
      - name: Move major version tag
        if: steps.version.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "v${{ steps.version.outputs.major }}" -m "Update v${{ steps.version.outputs.major }} to v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.major }}" --force
