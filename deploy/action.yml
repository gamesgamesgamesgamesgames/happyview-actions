name: 'HappyView Deploy'
description: 'Make a HappyView instance match a project: its plugins, lexicons, scripts and modules (hpy happyview deploy)'
author: 'gamesgamesgamesgamesgames'
branding:
  icon: 'upload-cloud'
  color: 'purple'
inputs:
  url:
    description: 'The instance, e.g. https://api.example.com'
    required: true
  api-key:
    description: 'An hv_ API key from the instance (use a secret). It needs project:deploy, plugins:read and plugins:create, and plugins:delete for prune-plugins'
    required: true
  working-directory:
    description: 'The HappyView project, the directory holding happyview.toml'
    required: false
    default: '.'
  dry-run:
    description: 'Show what would change on the instance without changing it'
    required: false
    default: 'false'
  prune-plugins:
    description: 'Also uninstall interpreters and libraries that happyview.lock does not list'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: hpy happyview deploy
      shell: bash
      env:
        PROJECT: ${{ inputs.working-directory }}
        DRY_RUN: ${{ inputs.dry-run }}
        PRUNE_PLUGINS: ${{ inputs.prune-plugins }}
        HPY_HV_URL: ${{ inputs.url }}
        HPY_HV_API_KEY: ${{ inputs.api-key }}
      run: |
        if ! command -v hpy > /dev/null; then
          echo "::error::hpy is not installed; run gamesgamesgamesgamesgames/happyview-actions/setup-hpy first"
          exit 1
        fi
        if [ -z "$HPY_HV_URL" ] || [ -z "$HPY_HV_API_KEY" ]; then
          echo "::error::url and api-key are both required"
          exit 1
        fi
        echo "::add-mask::$HPY_HV_API_KEY"
        # --yes accepts the plan, and with it the capabilities happyview.lock
        # records for each plugin, as committed and reviewed.
        args=(--no-input -C "$PROJECT" happyview deploy --yes)
        if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        if [ "$PRUNE_PLUGINS" = "true" ]; then args+=(--prune-plugins); fi
        hpy "${args[@]}"
